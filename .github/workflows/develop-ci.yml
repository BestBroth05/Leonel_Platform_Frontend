name: develop-ci

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        env:
          VITE_API_URL: http://localhost:3000
        run: pnpm build

      - name: Docker build
        run: docker build --build-arg VITE_API_URL=http://localhost:3000 -t leonel-platform-web:ci .
